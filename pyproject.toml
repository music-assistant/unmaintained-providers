[project]
name = "unmaintained-providers"
version = "0.0.0"
description = "Music Assistant providers without an active maintainer"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  # the server version these providers are developed against: a release tag or a commit after the
  # @; scripts/server_pin.py moves it to a release, with the sendspin group below
  "music-assistant @ git+https://github.com/music-assistant/server@2.11.0.dev2026112703",
  {include-group = "sendspin"},
  {include-group = "providers"},
  "codespell==2.4.3",
  "mypy==2.3.0",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-aiohttp==1.1.1",
  "pytest-timeout==2.4.0",
  "ruff==0.16.5",
]
# the requirements of the server's Sendspin provider, which it starts at every boot, as in
# music_assistant/providers/sendspin/manifest.json of the server; scripts/server_pin.py copies them
sendspin = [
  "aiosendspin[server]==11.0.0",
  "av==19.0.2",
  "soxr==1.1.0",
]
# the requirements in the manifest.json of each provider, for the tests and the type check
providers = [
  "qqmusic-api-python==0.8.2",
]

[tool.uv]
# the provider is loaded by the server from its folder, never installed as a package
package = false

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

# the server takes torch from the CPU index; PyPI's Linux build pulls in gigabytes of GPU libraries
[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchaudio = {index = "pytorch-cpu"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 120

[tool.mypy]
platform = "linux"
python_version = "3.14"
files = ["."]
exclude = ['^\.venv/']
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = [
  "annotation-unchecked",
  "import-not-found",
  "import-untyped",
]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = [
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  "truthy-iterable",
]
extra_checks = true
local_partial_types = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
# the multi-line docstring summary starts on the line after the quotes
extend-select = ["D213"]
# the rules of the server, where the code of these providers comes from
ignore = [
  "ANN002", # Just annoying, not really useful
  "ANN003", # Just annoying, not really useful
  "ANN401", # Opinioated warning on disallowing dynamically typed expressions
  "D203", # Conflicts with other rules
  "D417", # False positives in some occasions
  "EM101", # Just annoying, not really useful
  "EM102", # Just annoying, not really useful
  "FIX002", # Just annoying, not really useful
  "PLR2004", # Just annoying, not really useful
  "PGH004", # Just annoying, not really useful
  "PD011", # Just annoying, not really useful
  "S101", # assert is often used to satisfy type checking
  "TC001", # Just annoying, not really useful
  "TC003", # Just annoying, not really useful
  "TD002", # Just annoying, not really useful
  "TD003", # Just annoying, not really useful
  "TD004", # Just annoying, not really useful
  "TRY003", # Just annoying, not really useful
  "TRY400", # Just annoying, not really useful
  "COM812", # Conflicts with the Ruff formatter
  "ASYNC109", # Not relevant, since we use helpers with configurable timeouts
  "ASYNC110", # Use `asyncio.Event` instead of awaiting `asyncio.sleep` in a `while` loop
  "N818", # Just annoying, not really useful
  "E501", # Handled by ruff formatter
  "ASYNC240", # Not relevant, we use asyncio not trio/anyio
  "UP047", # Not yet ready to migrate to type parameters
  "PLW0108", # Just annoying, not really useful
  "CPY001", # Just annoying, not really useful
  "LOG004", # Just annoying, not really useful
  "FURB110", # Just annoying, not really useful  # TEMPORARY DISABLED rules  # The below rules must be enabled later one-by-one !
  "FBT001",
  "FBT002",
  "FBT003",
  "ANN001",
  "ANN202",
  "PTH118",
  "PTH120",
  "PTH123",
  "S106",
  "SLF001",
  "SIM102",
  "PERF401",
  "ARG002",
  "B904",
  "S324",
  "S304",
  "TRY300",
  "S608",
  "ANN204",
  "ISC004", # To implement later
  "PLR0917", # To implement later
]

[tool.ruff.lint.pylint]

max-args = 10
max-branches = 25
max-returns = 15
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
# Sphinx-style docstrings with :param:
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# command line scripts
"scripts/**" = ["INP001", "T201"]
# tests use wildcard addresses, made-up tokens and passwords as fixtures
"tests/**" = ["S104", "S105"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["music_assistant"]

[tool.codespell]
skip = "uv.lock,LICENSE,*/translations/*"

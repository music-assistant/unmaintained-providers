name: Server pin

# Moves the server the providers are developed against to a newer release of the server, with
# scripts/server_pin.py, and pushes that to the default branch once the type check and the tests
# pass on it. Start it by hand under Actions, or with a server-release dispatch. A move that fails
# its checks opens an issue, which the next move closes.

on:
  repository_dispatch:
    types: [server-release]
  workflow_dispatch:
    inputs:
      version:
        description: The release of the server to move to, such as 2.11.0
        required: true
        type: string

permissions: {}

# a newer release replaces one that still waits; a running move finishes first
concurrency:
  group: server-pin
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.client_payload.server_version || inputs.version }}
  ISSUE_TITLE: The providers do not pass on the newest server

jobs:
  # runs the code of the new server and its requirements, so it can change nothing
  check:
    name: Check the providers on the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      move: ${{ steps.release.outputs.move }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # the branch as it is now, with the pin an earlier run may just have moved
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check that the release is newer than the pin
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+|rc[0-9]+|\.dev[0-9]+)?$ ]]; then
            echo "::error::'$VERSION' is not a release of the server, such as 2.11.0"
            exit 1
          fi
          pin=$(sed -nE 's|.*"music-assistant @ git\+https://github\.com/music-assistant/server@([^"]+)".*|\1|p' pyproject.toml)
          # newer than the pin, and a release of dev rather than of a release branch
          newer=$(gh api "repos/music-assistant/server/compare/$pin...$VERSION" --jq .status)
          dev=$(gh api "repos/music-assistant/server/compare/$VERSION...dev" --jq .status)
          echo "$VERSION is $newer of the pin $pin; dev is $dev of $VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$newer" = ahead ] && { [ "$dev" = ahead ] || [ "$dev" = identical ]; }; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.release.outputs.move == 'true'
      - name: Move the pin
        if: steps.release.outputs.move == 'true'
        run: |
          uv run --no-project --python 3.14 python scripts/server_pin.py "$VERSION"
          uv lock
      # handed over before the new requirements run any code; the push still waits for the checks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.move == 'true'
        with:
          name: server-pin
          path: |
            pyproject.toml
            uv.lock
          retention-days: 1
      - name: Check the providers
        if: steps.release.outputs.move == 'true'
        run: |
          uv sync --locked
          uv run mypy
          uv run pytest

  push:
    name: Push the move
    needs: check
    if: needs.check.outputs.move == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      # the commit that was checked; a branch that moved meanwhile refuses the push
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-pin
          path: ${{ runner.temp }}/checked
      # pyproject.toml must be what the script makes of it; only the lock comes from the check
      - name: Take the checked move
        env:
          CHECKED: ${{ runner.temp }}/checked
        run: |
          python3 scripts/server_pin.py "$VERSION"
          cmp pyproject.toml "$CHECKED/pyproject.toml"
          cp "$CHECKED/uv.lock" uv.lock
          if [ "$(git status --porcelain)" != "$(printf ' M pyproject.toml\n M uv.lock')" ]; then
            git status --porcelain
            echo "::error::The move changes more than pyproject.toml and uv.lock"
            exit 1
          fi
      - name: Push the move
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Develop against server $VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:$BRANCH"
      - name: Close the issue of a failed move
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --app github-actions \
            --json number,title --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Server $VERSION passes; the pin moved to it."
          fi

  report:
    name: Report the failed checks
    needs: check
    # also checks that ran out of time
    if: always() && needs.check.result != 'success' && needs.check.outputs.move == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report the failed checks in an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --app github-actions \
            --json number,title --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "Server $VERSION fails too: $run"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
              --body "Moving the server pin to $VERSION failed its checks: $run. The pin stays where it is; the next release that passes moves it and closes this issue."
          fi
